name: 🚀 Feature Request
description: Suggest an idea, feature, or enhancement
title: "[FEATURE]:"

body:
  - type: checkboxes
    id: verified
    attributes:
      label: Feature hasn't been suggested before.
      options:
        - label: I have verified this feature I'm about to request hasn't been suggested before.
          required: true

  - type: textarea
    attributes:
      label: Describe the enhancement you want to request
      description: Describe the problem, desired outcome, proposed scope and how success could be verified. Major product decisions require owner agreement before implementation.
    validations:
      required: true
